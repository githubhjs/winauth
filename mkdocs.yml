site_name: winauth-cli
site_description: Cross-platform GUI-free WinAuth CLI for Mono on Linux, macOS, and Windows
site_author: Chih-Hsueh "Josh" HUANG <huangjs@gmail.com>
site_url: https://winauth-cli.readthedocs.io/en/latest/
repo_url: https://github.com/githubhjs/winauth-running-on-all-OS.cli
docs_dir: mkdocs-src
copyright: Copyright &copy; Chih-Hsueh "Josh" HUANG &lt;huangjs@gmail.com&gt;

nav:
  - Home: index.md
  - Installation: installation.md
  - CLI Usage: usage.md
  - Compiling: compiling.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
        - locale: zh
          name: 简体中文
          build: true
        - locale: hi
          name: हिन्दी
          build: true
        - locale: es
          name: Español
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: ar
          name: العربية
          build: true
        - locale: bn
          name: বাংলা
          build: true
        - locale: pt
          name: Português
          build: true
        - locale: ru
          name: Русский
          build: true
        - locale: ur
          name: اردو
          build: true
        - locale: id
          name: Bahasa Indonesia
          build: true
        - locale: de
          name: Deutsch
          build: true
        # mr, sw, bo, hak: mkdocs-material has no built-in UI-translation file
        # for any of these four, and mkdocs-static-i18n hard-crashes the build
        # without one (no fallback option available in the plugin itself).
        # Fixed via theme.custom_dir (see overrides/partials/languages/*.html
        # below) supplying the missing template file directly -- see
        # STEAM_ASF_STATUS.md for the full writeup. bo and hak translations
        # are lower-confidence (flagged inline in their override files and
        # content) -- review by a native/fluent speaker recommended.
        - locale: mr
          name: मराठी
          build: true
        - locale: sw
          name: Kiswahili
          build: true
        - locale: bo
          name: བོད་སྐད།
          build: true
        - locale: zh-Hakk
          name: 客家話
          build: true
        - locale: te
          name: తెలుగు
          build: true
        - locale: tr
          name: Türkçe
          build: true
        - locale: ta
          name: தமிழ்
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
        - locale: ko
          name: 한국어
          build: true
        - locale: it
          name: Italiano
          build: true

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - content.code.copy
  palette:
    # Auto: follows the OS/browser prefers-color-scheme setting
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: indigo
      accent: indigo
