site_name: winauth-cli
site_description: Cross-platform GUI-free WinAuth CLI for Mono on Linux, macOS, and Windows
repo_url: https://github.com/githubhjs/winauth-running-on-all-OS.cli
docs_dir: mkdocs-src

nav:
  - Home: index.md
  - Installation: installation.md
  - CLI Usage: usage.md
  - Compiling: compiling.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  palette:
    # Auto: follows the OS/browser prefers-color-scheme setting
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: indigo
      accent: indigo
